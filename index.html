<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハロウィン親指シフト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="title">

<!-- 共通シンボル -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bat" viewBox="0 0 64 30">
      <polygon points="32,10 34,5 35,10 40,9 48,6 56,6 64,12 58,13 54,18 49,16 45,21 40,18 36,22 32,26 28,22 24,18 19,21 15,16 10,18 6,13 0,12 8,6 16,6 24,9 29,10 30,5"/>
    </symbol>
    <symbol id="pumpkin" viewBox="0 0 100 82">
      <path d="M48 16 q1 -10 10 -13" stroke="#2f4a17" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="30" cy="48" rx="22" ry="30" fill="#d9560a"/>
      <ellipse cx="70" cy="48" rx="22" ry="30" fill="#d9560a"/>
      <ellipse cx="50" cy="48" rx="24" ry="32" fill="#ff7b1c"/>
      <g class="pk-face" fill="#ffd84a">
        <polygon points="32,40 41,30 44,44"/>
        <polygon points="68,40 59,30 56,44"/>
        <path d="M28 56 Q50 76 72 56 L65 59 L60 55 L55 61 L50 55 L45 61 L40 55 L35 59 Z"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- 背景シーン -->
<div id="scene" aria-hidden="true">
  <div class="bg-image"></div>
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <img class="bg-witch" src="assets/witch.png" alt="" onerror="this.remove()">
  <svg class="bat b1"><use href="#bat"/></svg>
  <svg class="bat b2"><use href="#bat"/></svg>
  <svg class="bat b3"><use href="#bat"/></svg>
  <svg class="bat b4"><use href="#bat"/></svg>
  <svg class="graveyard" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice">
    <g class="gy-art">
    <path d="M0 210 Q 220 140 440 195 T 880 185 T 1440 170 V300 H0Z" fill="#1b0f30"/>
    <!-- 枯れ木 -->
    <g stroke="#0b0614" stroke-linecap="round" fill="none">
      <path d="M150 230 C 150 170 140 140 120 100" stroke-width="14"/>
      <path d="M140 150 C 110 140 95 120 80 95" stroke-width="7"/>
      <path d="M128 115 C 140 95 160 85 175 60" stroke-width="6"/>
      <path d="M146 180 C 175 165 195 150 215 120" stroke-width="7"/>
      <path d="M200 140 C 215 135 225 128 238 112" stroke-width="4"/>
      <path d="M120 100 C 112 85 110 72 104 60" stroke-width="5"/>
      <path d="M1290 220 C 1295 170 1310 140 1335 110" stroke-width="12"/>
      <path d="M1300 165 C 1270 150 1255 135 1240 110" stroke-width="6"/>
      <path d="M1320 130 C 1345 120 1360 105 1372 85" stroke-width="5"/>
    </g>
    <!-- 墓石 -->
    <g fill="#2a1d40" stroke="#45336a" stroke-width="3">
      <path d="M300 262 v-56 a28 28 0 0 1 56 0 v56z"/>
      <path d="M420 262 v-38 a20 20 0 0 1 40 0 v38z"/>
      <path d="M560 262 v-70 h14 v-22 h16 v22 h14 v16 h-14 v54z"/>
      <path d="M930 262 v-60 a30 30 0 0 1 60 0 v60z"/>
      <path d="M1060 262 v-42 a22 22 0 0 1 44 0 v42z"/>
      <path d="M1170 262 v-64 h14 v-20 h16 v20 h14 v16 h-14 v48z"/>
    </g>
    <text x="328" y="222" fill="#5a4785" font-size="16" font-weight="700" text-anchor="middle" font-family="serif">R.I.P</text>
    <text x="960" y="220" fill="#5a4785" font-size="14" font-weight="700" text-anchor="middle" font-family="serif">BOO</text>
    <path d="M0 252 Q 300 222 620 246 T 1220 236 T 1440 240 V300 H0Z" fill="#0b0614"/>
    </g>
    <use href="#pumpkin" x="210" y="214" width="70" height="58" class="pk"/>
    <use href="#pumpkin" x="470" y="230" width="46" height="38" class="pk"/>
    <use href="#pumpkin" x="830" y="222" width="62" height="52" class="pk"/>
    <use href="#pumpkin" x="1220" y="226" width="52" height="44" class="pk"/>
  </svg>
  <div class="mist"></div>
</div>

<!-- 入力方式の切り替え（タイトル画面の右下） -->
<button id="mode-btn" class="mode-btn" type="button">⇄ <span id="mode-label"></span></button>

<main>
  <!-- タイトル画面 -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <img class="title-ghost" src="assets/ghost_normal.png" alt="" onerror="this.remove()">
      <h1 class="title-logo"><span>ハロウィン</span><em class="only-nicola">親指シフト</em><em class="only-morse">モールス信号</em></h1>
      <button id="start-btn" class="start-btn" type="button"><kbd>Enter</kbd> スタート</button>
      <div><button id="tut-btn" class="tut-open-btn" type="button"><span class="only-nicola">親指シフトとは？</span><span class="only-morse">モールス信号とは？</span> <kbd>H</kbd></button></div>
      <p id="title-best" class="title-best"></p>
      <div class="title-foot">
        <button id="thumb-btn" class="chip-btn only-nicola" type="button">親指キー：<b id="thumb-name"></b> <kbd>T</kbd></button>
        <button id="bgm-btn" class="chip-btn" type="button">BGM：<b id="bgm-state"></b> <kbd>M</kbd></button>
      </div>
      <p class="howto k-pc">IMEはオフ（半角英数）で</p>
    </div>
  </section>

  <!-- 練習画面 -->
  <section id="screen-play" class="screen">
    <header class="play-head">
      <button id="quit-btn" class="quit-btn k-touch" type="button" aria-label="タイトルへ">✕</button>
      <div class="ph-stage"><b id="ph-stage-name">ハロウィン単語</b></div>
      <div class="ph-progress"><span id="play-count"></span><div class="bar"><i id="play-bar"></i></div></div>
      <dl class="ph-stats">
        <div><dt>正確率</dt><dd id="stat-acc">100%</dd></div>
        <div><dt>速度</dt><dd><span id="stat-speed">0</span><small>字/分</small></dd></div>
        <div><dt>コンボ</dt><dd id="stat-combo">0</dd></div>
      </dl>
    </header>

    <div class="stage-area">
      <div class="ghost-wrap">
        <div id="ghost-bubble" class="bubble"></div>
        <div id="ghost" class="ghost">
          <svg class="ghost-svg" viewBox="0 0 100 120">
            <path class="g-body" d="M50 6 C24 6 12 28 12 52 V104 l9.5 -9 9.5 9 9.5 -9 9.5 9 9.5 -9 9.5 9 9.5 -9 9.5 9 V52 C88 28 76 6 50 6Z"/>
            <ellipse cx="30" cy="64" rx="6" ry="3.5" fill="#ff9ec4" opacity=".7"/>
            <ellipse cx="70" cy="64" rx="6" ry="3.5" fill="#ff9ec4" opacity=".7"/>
            <g class="eyes-normal" fill="#1b1030">
              <ellipse cx="37" cy="50" rx="5" ry="7"/><ellipse cx="63" cy="50" rx="5" ry="7"/>
            </g>
            <g class="eyes-happy" stroke="#1b1030" stroke-width="4" fill="none" stroke-linecap="round">
              <path d="M31 52 q6 -9 12 0"/><path d="M57 52 q6 -9 12 0"/>
            </g>
            <g class="eyes-scared" stroke="#1b1030" stroke-width="4" stroke-linecap="round">
              <path d="M32 44 l10 10 M42 44 l-10 10"/><path d="M58 44 l10 10 M68 44 l-10 10"/>
            </g>
            <ellipse class="m-normal" cx="50" cy="68" rx="4.5" ry="5.5" fill="#1b1030"/>
            <path class="m-happy" d="M41 64 q9 12 18 0 z" fill="#1b1030"/>
            <path class="m-scared" d="M38 72 q4 -6 8 0 t8 0 t8 0" stroke="#1b1030" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </svg>
          <img class="ghost-img gi-normal" alt="">
          <img class="ghost-img gi-happy" alt="">
          <img class="ghost-img gi-scared" alt="">
        </div>
      </div>

      <div id="prompt-box" class="prompt-box">
        <div id="prompt-display" class="prompt-display"></div>
        <div id="prompt-kana" class="prompt-kana"></div>
      </div>

      <div class="next-box">
        <div class="next-label">つぎの文字</div>
        <div id="next-char" class="next-char"></div>
        <div id="next-hint" class="next-hint"></div>
        <div id="next-after" class="next-after"></div>
      </div>
    </div>

    <div id="kb-wrap" class="kb-wrap">
      <div id="keyboard" class="keyboard only-nicola"></div>
      <div id="morse-pad" class="morse-pad only-morse">
        <div id="morse-chart" class="morse-chart"></div>
        <div id="morse-key" class="morse-key">
          <div class="mk-head"><span class="k-pc"><kbd>Space</kbd> 電鍵</span><span class="k-touch">ここを押す</span> <span class="mk-sym"></span></div>
          <div class="mk-gauge"><i id="morse-gauge"></i><span class="mk-z z-dot">・ 短く</span><span class="mk-z z-dash">－ 長く</span></div>
        </div>
      </div>
      <p class="kb-legend only-nicola">
        <span class="lg-l">左親指と同時</span>
        <span class="lg-n">単独</span>
        <span class="lg-r">右親指と同時</span>
        <span class="lg-k"><kbd>Tab</kbd> キーボード表示 ／ <kbd>Esc</kbd> タイトルへ</span>
      </p>
      <p class="kb-legend only-morse">
        <span class="lg-k"><kbd>Space</kbd> 短く押す＝・ 長く押す＝－ ／ <kbd>Tab</kbd> 符号表 ／ <kbd>Esc</kbd> タイトルへ</span>
      </p>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div class="res-top">
        <div class="res-rank-wrap">
          <div id="res-rank" class="res-rank"></div>
          <img id="res-ghost" class="res-ghost" alt="" hidden>
        </div>
        <div class="res-titlebox">
          <p class="res-label">あなたの称号</p>
          <h2 id="res-title" class="res-title"></h2>
          <p id="res-comment" class="res-comment"></p>
          <p id="res-best" class="res-best" hidden>★ 自己ベスト更新！</p>
        </div>
      </div>
      <dl class="res-stats">
        <div><dt>スコア</dt><dd id="res-score"></dd></div>
        <div><dt>正確率</dt><dd id="res-acc"></dd></div>
        <div><dt>入力速度</dt><dd id="res-speed"></dd></div>
      </dl>
      <dl class="res-sub">
        <div><dt>最大コンボ</dt><dd id="res-combo"></dd></div>
        <div><dt>ミス</dt><dd id="res-miss"></dd></div>
        <div><dt>タイム</dt><dd id="res-time"></dd></div>
      </dl>
      <div class="res-badges">
        <h3>バッジ <span id="res-badge-count"></span></h3>
        <ul id="res-badges"></ul>
      </div>
      <div class="res-btns">
        <button id="btn-retry" type="button"><kbd>Enter</kbd> もう一度</button>
        <button id="btn-title" type="button"><kbd>Esc</kbd> タイトル</button>
      </div>
      <div class="res-share">
        <button id="btn-share-x" type="button">𝕏 で共有</button>
        <button id="btn-copy" type="button">結果をコピー</button>
      </div>
    </div>
  </section>
</main>

<!-- ミニゲーム（ノーミスで単語を打つと割り込む）：親指シフトは黒猫ダッシュ、モールスはほうきフライト -->
<section id="cat-run" class="cat-run" hidden>
  <div class="cr-head">
    <div id="cr-title" class="cr-title"></div>
    <div class="cr-song" title="曲が終わるまで逃げきれ！"><i id="cr-bar"></i></div>
    <div class="cr-score"><span id="cr-score">0</span><small>m</small></div>
  </div>
  <canvas id="cr-canvas" class="cr-canvas"></canvas>
  <div id="cr-msg" class="cr-msg"></div>
  <p id="cr-hint" class="cr-hint"></p>
</section>

<!-- チュートリアル -->
<div id="tut" hidden>
  <svg class="tut-shade" aria-hidden="true">
    <defs>
      <mask id="tut-mask">
        <rect width="100%" height="100%" fill="#fff"/>
        <g id="tut-holes" fill="#000"></g>
      </mask>
    </defs>
    <rect class="tut-dim" width="100%" height="100%" mask="url(#tut-mask)"/>
  </svg>
  <div id="tut-rings"></div>
  <div id="tut-card" class="tut-card" role="dialog" aria-labelledby="tut-title">
    <div class="tut-head">
      <ol id="tut-chapters" class="tut-chapters"></ol>
      <span id="tut-count" class="tut-count"></span>
    </div>
    <div class="tut-body">
      <h2 id="tut-title" class="tut-title"></h2>
      <div id="tut-text" class="tut-text"></div>
      <p id="tut-status" class="tut-status"></p>
    </div>
    <div class="tut-btns">
      <button id="tut-exit" type="button"><kbd>Esc</kbd> 終了</button>
      <button id="tut-prev" type="button"><kbd>←</kbd> もどる</button>
      <button id="tut-next" type="button"></button>
    </div>
  </div>
</div>

<div id="flash" class="flash"></div>
<div id="fx-layer" class="fx-layer"></div>
<div id="toast" class="toast"></div>
<audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
<audio id="cat-bgm" src="assets/old_bgm.mp3" preload="auto"></audio>

<script src="js/nicola.js"></script>
<script src="js/data.js"></script>
<script src="js/morse.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/catrun.js"></script>
<script src="js/witchfly.js"></script>
<script src="js/main.js"></script>
</body>
</html>
